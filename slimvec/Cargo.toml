# Copyright © ickk, 2026

[package]
name = "slimvec"
version = "0.4.9"
authors = ["ickk <crates@ickk.io>"]
license = "Zlib OR MIT OR Apache-2.0"
description = "Dynamic array with a smaller inline-size"
repository = "https://github.com/ickk/slimvec"
readme = "README.md"
edition.workspace = true
categories = ["data-structures", "no-std"]
keywords = ["thin", "vec", "thinvec"]
include = [
  "src/",
  "LICENSE-MIT",
  "LICENSE-ZLIB",
  "LICENSE-APACHE2",
  "README.md",
  "docs/Overview.md",
  "docs/Features.md",
  "docs/Architecture.md",
]

[features]
default = ["std"]

arbitrary = ["dep:arbitrary"]
borsh = ["dep:borsh"]
comparable = ["dep:comparable"]
serde = ["dep:serde_core"]
std = []
valuable = ["dep:valuable"]

[dependencies]
arbitrary = { workspace = true, optional = true }
borsh = { workspace = true, optional = true }
comparable = { workspace = true, optional = true }
serde_core = { workspace = true, optional = true }
valuable = { workspace = true, optional = true }

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true
