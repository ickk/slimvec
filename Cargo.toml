[workspace]
resolver = "2"
members = ["slimvec", "test-suites"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
slimvec.path = "slimvec"

arbitrary = { version = "1.0", default-features = false }
impls = { version = "1.0", default-features = false }
serde_core = { version = "1.0", default-features = false }
valuable = { version = "0.1.0", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
